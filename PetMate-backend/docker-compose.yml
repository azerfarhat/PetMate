name: pawmate

services:
  db:
    image: postgres:18-alpine
    container_name: pawmate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Hôte 5432 -> conteneur 5432 (accès DB docker externe)
      - "5432:5432"
    volumes:
      # Postgres 18+ exige un montage unique sur /var/lib/postgresql
      # (données placées dans un sous-dossier versionné, ex. 18/main)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: PetMate-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Surcharge réseau interne : le backend parle à la base "db" du compose
      DB_HOST: db
      DB_PORT: "5432"
      # Le backend envoie les emails via le SMTP réel défini dans .env.
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: