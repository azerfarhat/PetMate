name: pawmate

services:
  db:
    image: postgres:18-alpine
    container_name: pawmate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Hôte 5432 -> conteneur 5432 (accès DB docker externe)
      - "5432:5432"
    volumes:
      # Postgres 18+ exige un montage unique sur /var/lib/postgresql
      # (données placées dans un sous-dossier versionné, ex. 18/main)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pawmate-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # API S3 : utilisée par le backend (réseau docker) ET par l'app pour
      # l'upload direct des photos.
      - "${MINIO_API_PORT:-9000}:9000"
      # Console web d'administration (http://localhost:9001).
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Volume persistant : les photos survivent aux redémarrages/rebuilds.
      - miniodata:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: PetMate-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Surcharge réseau interne : le backend parle à la base "db" du compose
      DB_HOST: db
      DB_PORT: "5432"
      # Le backend envoie les emails via le SMTP réel défini dans .env.
      # Endpoint MinIO vu de l'intérieur du réseau docker (jamais "localhost").
      MINIO_ENDPOINT: http://minio:9000
      # Endpoint MinIO vu par les clients (app) : localhost = machine hôte.
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      # Démarre avec MinIO (l'initialisation du bucket ré-essaie si nécessaire).
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata: