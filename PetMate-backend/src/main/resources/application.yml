spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pawmate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  flyway:
    enabled: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}
  refresh-token-remember-me-expiration: ${JWT_REFRESH_TOKEN_REMEMBER_ME_EXPIRATION:2592000}

app:
  mail:
    from: ${MAIL_FROM:noreply@pawmate.app}
  verification:
    token-expiration-minutes: ${VERIFICATION_TOKEN_EXPIRATION_MINUTES:60}
    base-url: ${APP_BASE_URL:http://localhost:8080}
    deep-link-scheme: ${APP_DEEP_LINK_SCHEME:}
    deep-link-host: ${APP_DEEP_LINK_HOST:verify}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
  rate-limit:
    register-max-per-window: ${REGISTER_MAX_PER_WINDOW:5}
    register-window-minutes: ${REGISTER_WINDOW_MINUTES:60}
  match:
    re-match-cooldown-days: ${RE_MATCH_COOLDOWN_DAYS:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    org.springframework.web: TRACE
    com.petmate.backend: DEBUG